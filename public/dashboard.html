<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spike</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1A1917;
      --surface: #1F1E1C;
      --surface2: #2A2926;
      --border: #333230;
      --border2: #47453F;
      --text: #EEECEA;
      --text-muted: #9C9A92;
      --text-subtle: #57554E;
      --accent: #D97757;
      --accent-dim: #C06240;
      --accent-glow: rgba(217,119,87,0.18);
      --accent-light: rgba(217,119,87,0.09);
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    body {
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; padding: 28px 24px 24px; text-align: center; overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(217,119,87,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217,119,87,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 55% 40% at 50% 100%, rgba(217,119,87,0.10) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 90% 0%, rgba(192,98,64,0.06) 0%, transparent 60%);
    }

    .topbar {
      position: relative; z-index: 1; width: 100%; max-width: 640px;
      display: flex; align-items: center; justify-content: space-between;
      flex: 0 0 auto; margin-bottom: 4px;
    }

    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon { width: 24px; height: 24px; }
    .brand-name { font-size: 15px; font-weight: 600; color: var(--text-muted); letter-spacing: -0.2px; }

    .signout {
      padding: 6px 12px; background: transparent; border: 1px solid var(--border);
      border-radius: 7px; color: var(--text-subtle); font-size: 12px; font-weight: 500;
      text-decoration: none; transition: all 0.15s;
    }
    .signout:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

    /* ── Tabs ─────────────────────────────────────────────────────── */
    .tabs {
      position: relative; z-index: 1;
      flex: 0 0 auto; margin-top: 22px; margin-bottom: 24px;
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .tab {
      display: flex; align-items: center; gap: 7px; padding: 9px 20px; border-radius: 999px;
      border: none; background: transparent; color: var(--text-subtle);
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text-muted); }
    .tab.active { background: var(--accent-light); color: var(--accent); }
    .tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab .badge {
      min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--accent); color: #1A1917; font-size: 10px; font-weight: 700;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }

    /* ── View container ──────────────────────────────────────────── */
    .view-container { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; justify-content: center; }
    .view { display: none; width: 100%; max-width: 560px; }
    .view.active { display: flex; flex-direction: column; align-items: center; }

    #talkView.active { justify-content: center; height: 100%; }

    #messagesView.active {
      justify-content: flex-start; height: 100%; overflow-y: auto; padding: 4px 4px 24px;
    }

    .messages-list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .msg-empty { padding: 90px 10px; font-size: 14px; color: var(--text-subtle); text-align: center; }
    .msg-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); transition: border-color 0.15s; }
    .msg-item.unread { border-color: rgba(217,119,87,0.35); background: var(--surface2); }
    .msg-from { font-size: 13px; font-weight: 600; color: var(--text); }
    .msg-body { font-size: 14px; color: var(--text-muted); margin-top: 5px; line-height: 1.55; }
    .msg-time { font-size: 11px; color: var(--text-subtle); margin-top: 9px; }

    /* ── Lists ────────────────────────────────────────────────────── */
    #listsView.active {
      justify-content: flex-start; height: 100%; overflow-y: auto; padding: 4px 4px 24px;
    }

    .lists-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; text-align: left; }

    .list-card {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface); cursor: pointer; text-align: left;
      font-family: 'Inter', sans-serif; color: var(--text); transition: all 0.15s;
    }
    .list-card:hover { border-color: var(--border2); background: var(--surface2); }
    .list-card-main { flex: 1 1 auto; min-width: 0; }
    .list-card-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .list-card-meta { font-size: 11px; color: var(--text-subtle); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600;
      background: var(--accent-light); color: var(--accent); letter-spacing: 0.2px;
    }
    .chip.muted { background: var(--surface2); color: var(--text-subtle); }
    .list-card-count { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .list-new {
      display: flex; align-items: center; gap: 9px; width: 100%; padding: 13px 16px;
      border: 1px dashed var(--border2); border-radius: 14px; background: transparent;
      color: var(--text-subtle); font-family: 'Inter', sans-serif; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .list-new:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-light); }
    .list-new svg {
      flex: 0 0 auto; width: 15px; height: 15px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .list-empty { padding: 70px 10px; font-size: 14px; color: var(--text-subtle); text-align: center; }

    /* Detail */
    .list-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .icon-btn {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }
    .icon-btn.danger:hover { color: #E8674C; border-color: rgba(232,103,76,0.4); background: rgba(232,103,76,0.08); }
    .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .list-title { flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    .list-subtitle { font-size: 11px; color: var(--text-subtle); margin: 0 0 14px 40px; }

    .list-title-input, .list-add-input {
      width: 100%; padding: 9px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 14px; outline: none;
    }
    .list-title-input:focus, .list-add-input:focus { border-color: var(--accent-dim); }

    .list-items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .list-item {
      display: flex; align-items: center; gap: 11px; padding: 11px 13px;
      border: 1px solid var(--border); border-radius: 11px; background: var(--surface);
      transition: all 0.15s;
    }
    .list-item:hover { border-color: var(--border2); }
    .list-item .box {
      flex: 0 0 auto; width: 19px; height: 19px; border-radius: 6px;
      border: 1.6px solid var(--border2); background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.15s;
    }
    .list-item .box:hover { border-color: var(--accent); }
    .list-item .box svg { width: 11px; height: 11px; stroke: #1A1917; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .list-item.done .box { background: var(--accent); border-color: var(--accent); }
    .list-item.done .box svg { opacity: 1; }
    .list-item .text { flex: 1 1 auto; min-width: 0; font-size: 14px; color: var(--text); word-break: break-word; }
    .list-item.done .text { color: var(--text-subtle); text-decoration: line-through; }
    .list-item .who { flex: 0 0 auto; font-size: 10px; color: var(--text-subtle); }
    .list-item .remove {
      flex: 0 0 auto; width: 22px; height: 22px; border: none; background: transparent;
      color: var(--text-subtle); cursor: pointer; opacity: 0; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .list-item:hover .remove { opacity: 1; }
    .list-item .remove:hover { color: #E8674C; background: rgba(232,103,76,0.1); }
    .list-item .remove svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    .share-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .share-label { font-size: 11px; color: var(--text-subtle); margin-right: 2px; }
    .share-chip {
      padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-subtle);
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .share-chip:hover { border-color: var(--border2); color: var(--text-muted); }
    .share-chip.on { background: var(--accent-light); border-color: var(--accent-dim); color: var(--accent); }

    .confirm-bar {
      display: flex; align-items: center; gap: 8px; padding: 11px 13px; margin-bottom: 12px;
      border: 1px solid rgba(232,103,76,0.35); border-radius: 11px; background: rgba(232,103,76,0.07);
      font-size: 12px; color: var(--text-muted);
    }
    .confirm-bar button {
      padding: 5px 11px; border-radius: 8px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    }
    .confirm-bar .yes { background: #E8674C; color: #1A1917; }
    .confirm-bar .no  { background: var(--surface2); color: var(--text-muted); }

    .exchange {
      max-width: 560px; margin-bottom: 48px; min-height: 90px;
      display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    .line { opacity: 0; transform: translateY(6px); transition: opacity 0.35s ease, transform 0.35s ease; }
    .line.show { opacity: 1; transform: translateY(0); }
    .line.user { font-size: 13px; color: var(--text-muted); }
    .line.assistant { font-size: 18px; line-height: 1.6; color: var(--text); font-weight: 400; letter-spacing: -0.1px; }

    .mic-wrap { position: relative; display: flex; align-items: center; justify-content: center; }

    /* ── Voice orb ────────────────────────────────────────────────── */
    .orb {
      position: relative; width: 148px; height: 148px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0f0e0d 0%, #030303 100%);
      border: none; overflow: hidden; cursor: pointer;
      box-shadow: 0 0 0 1px rgba(217,119,87,0.15), 0 0 46px rgba(217,119,87,0.22), 0 16px 40px rgba(0,0,0,0.5);
      transition: box-shadow 0.4s ease, transform 0.2s ease;
    }
    .orb:hover { box-shadow: 0 0 0 1px rgba(217,119,87,0.3), 0 0 60px rgba(217,119,87,0.32), 0 16px 40px rgba(0,0,0,0.5); }

    .orb-blob {
      position: absolute; border-radius: 50%; filter: blur(18px); mix-blend-mode: screen;
      will-change: transform;
    }
    .orb-blob-1 {
      width: 72%; height: 72%; top: -12%; left: -14%;
      background: radial-gradient(circle at 35% 35%, #FFC896 0%, #D97757 55%, transparent 75%);
      animation: orbFloat1 7s ease-in-out infinite;
    }
    .orb-blob-2 {
      width: 66%; height: 66%; bottom: -16%; right: -12%;
      background: radial-gradient(circle at 60% 60%, #E8875C 0%, #8F3A1C 55%, transparent 75%);
      animation: orbFloat2 9s ease-in-out infinite;
    }
    .orb-blob-3 {
      width: 55%; height: 55%; top: 22%; right: 2%;
      background: radial-gradient(circle at 50% 50%, #A84A22 0%, transparent 78%);
      mix-blend-mode: soft-light; opacity: 0.8;
      animation: orbFloat3 11s ease-in-out infinite;
    }
    .orb-shine {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 30% 24%, rgba(255,255,255,0.22), transparent 45%);
    }

    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(12%, 14%) scale(1.18); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-14%, -10%) scale(1.12); }
    }
    @keyframes orbFloat3 {
      0%, 100% { transform: translate(0,0) rotate(0deg) scale(1); }
      50%      { transform: translate(-8%, 10%) rotate(30deg) scale(1.25); }
    }

    .orb.listening { box-shadow: 0 0 0 1px rgba(217,119,87,0.45), 0 0 70px rgba(217,119,87,0.5), 0 16px 40px rgba(0,0,0,0.5); }
    .orb.listening .orb-blob-1 { animation-duration: 2.1s; }
    .orb.listening .orb-blob-2 { animation-duration: 2.5s; }
    .orb.listening .orb-blob-3 { animation-duration: 2.8s; }

    .orb.thinking { cursor: default; animation: orbThink 1.3s ease-in-out infinite; }
    .orb.thinking .orb-blob-1 { animation-duration: 1.6s; }
    .orb.thinking .orb-blob-2 { animation-duration: 1.9s; }
    .orb.thinking .orb-blob-3 { animation-duration: 2.1s; }
    @keyframes orbThink {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }

    .status { margin-top: 22px; font-size: 13px; color: var(--text-subtle); letter-spacing: 0.2px; min-height: 18px; }

    .fallback { margin-top: 22px; display: none; gap: 8px; }
    .fallback.show { display: flex; }
    .fallback input {
      width: 280px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    }
    .fallback input:focus { border-color: var(--accent-dim); }
    .fallback button {
      padding: 10px 16px; border-radius: 10px; border: none; background: var(--accent); color: #1A1917;
      font-weight: 600; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .fallback button:hover { background: var(--accent-dim); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="la0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F2B896"/><stop offset="100%" stop-color="#C85C30"/></linearGradient>
          <linearGradient id="la1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E8956A"/><stop offset="100%" stop-color="#B84228"/></linearGradient>
          <linearGradient id="la2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97757"/><stop offset="100%" stop-color="#A84020"/></linearGradient>
          <linearGradient id="la3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E08060"/><stop offset="100%" stop-color="#C06040"/></linearGradient>
          <linearGradient id="la4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0A880"/><stop offset="100%" stop-color="#D07050"/></linearGradient>
          <linearGradient id="la5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C86848"/><stop offset="100%" stop-color="#D98060"/></linearGradient>
        </defs>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la0)" transform="rotate(0,50,50)"/>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la1)" transform="rotate(60,50,50)"/>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la2)" transform="rotate(120,50,50)"/>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la3)" transform="rotate(180,50,50)"/>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la4)" transform="rotate(240,50,50)"/>
        <ellipse cx="50" cy="50" rx="11" ry="44" fill="url(#la5)" transform="rotate(300,50,50)"/>
      </svg>
      <span class="brand-name">Spike</span>
    </div>
    <a href="/auth/logout" class="signout">Sign out</a>
  </div>

  <div class="tabs">
    <button class="tab active" id="talkTab" data-view="talk">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      Talk
    </button>
    <button class="tab" id="messagesTab" data-view="messages">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v14H8l-4 4V4Z"/><path d="M8 9h8M8 13h5"/></svg>
      Messages
      <span class="badge" id="msgBadge" style="display:none"></span>
    </button>
    <button class="tab" id="listsTab" data-view="lists">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
      Lists
    </button>
  </div>

  <div class="view-container">
    <div class="view active" id="talkView">
      <div class="exchange" id="exchange"></div>

      <div class="mic-wrap">
        <button class="orb" id="micBtn" aria-label="Talk to Spike">
          <span class="orb-blob orb-blob-1"></span>
          <span class="orb-blob orb-blob-2"></span>
          <span class="orb-blob orb-blob-3"></span>
          <span class="orb-shine"></span>
        </button>
      </div>

      <div class="status" id="status">Tap to talk</div>

      <div class="fallback" id="fallback">
        <input id="fallbackInput" type="text" placeholder="Type your message…" />
        <button id="fallbackSend">Send</button>
      </div>
    </div>

    <div class="view" id="messagesView">
      <div class="messages-list" id="messagesList"></div>
    </div>

    <div class="view" id="listsView">
      <div class="lists-wrap" id="listsWrap"></div>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let recognition = null;
    let listening = false;
    let isSpeaking = false;

    // ElevenLabs voice playback — best-effort. A TTS hiccup never blocks the text reply
    // from showing, but failures are logged (not swallowed) so they're visible in devtools.
    async function playText(text) {
      if (isSpeaking || !text) return;
      isSpeaking = true;
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          console.error('TTS request failed:', res.status, err.error || err);
          isSpeaking = false;
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => { URL.revokeObjectURL(url); isSpeaking = false; };
        audio.onerror = () => { console.error('Audio playback error'); URL.revokeObjectURL(url); isSpeaking = false; };
        audio.play().catch((e) => { console.error('Audio play() rejected:', e.name, e.message); URL.revokeObjectURL(url); isSpeaking = false; });
      } catch (e) {
        console.error('TTS fetch failed:', e.message);
        isSpeaking = false;
      }
    }

    const micBtn      = document.getElementById('micBtn');
    const statusEl     = document.getElementById('status');
    const exchangeEl   = document.getElementById('exchange');
    const fallbackEl   = document.getElementById('fallback');

    function setStatus(text) { statusEl.textContent = text; }

    function renderExchange(userText, assistantText) {
      exchangeEl.innerHTML = '';
      if (userText) {
        const u = document.createElement('div');
        u.className = 'line user';
        u.textContent = userText;
        exchangeEl.appendChild(u);
        requestAnimationFrame(() => u.classList.add('show'));
      }
      if (assistantText) {
        const a = document.createElement('div');
        a.className = 'line assistant';
        a.textContent = assistantText;
        exchangeEl.appendChild(a);
        requestAnimationFrame(() => a.classList.add('show'));
      }
    }

    async function sendToAgent(text) {
      if (!text?.trim()) return;
      renderExchange(text, '');
      micBtn.classList.add('thinking');
      setStatus('Thinking…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: chatHistory })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');

        chatHistory.push({ role: 'user', content: text });
        chatHistory.push({ role: 'assistant', content: data.message });
        chatHistory = chatHistory.slice(-20);

        renderExchange(text, data.message);
        setStatus('Tap to talk');
        playText(data.message);
      } catch (err) {
        renderExchange(text, `Sorry — ${err.message}`);
        setStatus('Tap to talk');
      } finally {
        micBtn.classList.remove('thinking');
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add('listening');
        setStatus('Listening…');
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        sendToAgent(transcript);
      };

      recognition.onerror = (e) => {
        setStatus(e.error === 'not-allowed' ? 'Microphone access denied' : 'Tap to talk');
      };

      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove('listening');
        if (statusEl.textContent === 'Listening…') setStatus('Tap to talk');
      };

      micBtn.addEventListener('click', () => {
        if (micBtn.classList.contains('thinking')) return;
        if (listening) { recognition.stop(); return; }
        try { recognition.start(); } catch {}
      });
    } else {
      setStatus("Voice isn't supported in this browser");
      fallbackEl.classList.add('show');
      micBtn.style.opacity = '0.35';
      micBtn.style.cursor = 'default';
    }

    document.getElementById('fallbackSend').addEventListener('click', () => {
      const input = document.getElementById('fallbackInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendToAgent(text);
    });
    document.getElementById('fallbackInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('fallbackSend').click();
    });

    // ── Tabs ──────────────────────────────────────────────────────
    const tabs  = document.querySelectorAll('.tab');
    const views = document.querySelectorAll('.view');

    function activateView(name) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
      views.forEach(v => v.classList.toggle('active', v.id === `${name}View`));
      if (name === 'messages') {
        fetchMessages();
        fetch('/api/messages/read', { method: 'POST' });
        msgBadge.style.display = 'none';
        msgBadge.textContent = '0';
      }
      if (name === 'lists') fetchLists();
    }

    tabs.forEach(tab => tab.addEventListener('click', () => activateView(tab.dataset.view)));

    // ── Messages ──────────────────────────────────────────────────
    const messagesList = document.getElementById('messagesList');
    const msgBadge      = document.getElementById('msgBadge');

    function renderMessages(messages) {
      if (!messages.length) {
        messagesList.innerHTML = '<div class="msg-empty">No messages yet</div>';
        return;
      }
      messagesList.innerHTML = messages.map(m => `
        <div class="msg-item ${m.read ? '' : 'unread'}">
          <div class="msg-from">${m.from}</div>
          <div class="msg-body">${m.body}</div>
          <div class="msg-time">${new Date(m.created_at + 'Z').toLocaleString()}</div>
        </div>
      `).join('');
    }

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) return;
        const { messages } = await res.json();
        renderMessages(messages);
        const unread = messages.filter(m => !m.read).length;
        msgBadge.textContent = unread;
        msgBadge.style.display = unread ? 'flex' : 'none';
        return messages;
      } catch {}
    }

    // ── Lists ─────────────────────────────────────────────────────
    // Two states in one view: an overview of every list, and a detail view for the
    // one that's open. All list/item text goes in via textContent, never innerHTML,
    // since it's written by family members and synced between them.
    const listsWrap = document.getElementById('listsWrap');
    let listsData    = [];
    let familyPeople = [];
    let openListId   = null;
    let creatingList = false;
    let confirmingDelete = false;
    let renamingList = false;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function icon(paths) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      for (const d of paths) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        svg.appendChild(path);
      }
      return svg;
    }

    async function listApi(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }

    async function fetchLists() {
      try {
        const { lists, family } = await listApi('/api/lists');
        listsData    = lists;
        familyPeople = family;
        renderLists();
      } catch {}
    }

    // Refresh from the server, then re-render whichever state is showing.
    async function refreshLists() {
      await fetchLists();
    }

    function renderLists() {
      // The open list may have been deleted by whoever owns it.
      if (openListId != null && !listsData.some(l => l.id === openListId)) openListId = null;
      listsWrap.innerHTML = '';
      if (openListId == null) renderOverview();
      else renderDetail(listsData.find(l => l.id === openListId));
    }

    function renderOverview() {
      if (!listsData.length && !creatingList) {
        listsWrap.appendChild(el('div', 'list-empty', 'No lists yet — make one, or just ask Spike.'));
      }

      for (const list of listsData) {
        const card = el('button', 'list-card');
        const main = el('div', 'list-card-main');
        main.appendChild(el('div', 'list-card-name', list.name));

        // Your own lists are labelled by who they reach; someone else's by who it came
        // from, since "shared with you" is the only part you'd care about.
        const meta = el('div', 'list-card-meta');
        if (list.is_owner) {
          const audience = list.audience === 'private' ? 'Private'
            : list.audience === 'everyone' ? 'Everyone'
            : list.shared_with.join(', ');
          meta.appendChild(el('span', list.audience === 'private' ? 'chip muted' : 'chip', audience));
        } else {
          meta.appendChild(el('span', 'chip', `From ${list.owner}`));
          if (list.shared_with.length) meta.appendChild(el('span', null, `also ${list.shared_with.join(', ')}`));
        }
        main.appendChild(meta);

        card.appendChild(main);
        card.appendChild(el('div', 'list-card-count', `${list.done}/${list.total}`));
        card.addEventListener('click', () => { openListId = list.id; renderLists(); });
        listsWrap.appendChild(card);
      }

      if (creatingList) {
        listsWrap.appendChild(buildNewListForm());
      } else {
        const add = el('button', 'list-new');
        add.appendChild(icon(['M12 5v14', 'M5 12h14']));
        add.appendChild(el('span', null, 'New list'));
        add.addEventListener('click', () => { creatingList = true; renderLists(); });
        listsWrap.appendChild(add);
      }
    }

    function buildNewListForm() {
      const wrap = el('div', 'list-card');
      wrap.style.cursor = 'default';
      wrap.style.flexDirection = 'column';
      wrap.style.alignItems = 'stretch';
      wrap.style.gap = '10px';

      const input = el('input', 'list-title-input');
      input.placeholder = 'List name…';
      wrap.appendChild(input);

      const chosen = new Set();
      const row = el('div', 'share-row');
      row.style.marginBottom = '0';
      row.appendChild(el('span', 'share-label', 'Share with'));
      for (const person of familyPeople) {
        const chip = el('button', 'share-chip', person.name);
        chip.addEventListener('click', () => {
          if (chosen.has(person.email)) chosen.delete(person.email);
          else chosen.add(person.email);
          chip.classList.toggle('on', chosen.has(person.email));
        });
        row.appendChild(chip);
      }
      wrap.appendChild(row);

      const actions = el('div', 'confirm-bar');
      actions.style.margin = '0';
      actions.style.background = 'transparent';
      actions.style.border = 'none';
      actions.style.padding = '0';
      actions.style.justifyContent = 'flex-end';

      const cancel = el('button', 'no', 'Cancel');
      cancel.addEventListener('click', () => { creatingList = false; renderLists(); });
      const create = el('button', 'yes', 'Create');
      create.style.background = 'var(--accent)';
      create.addEventListener('click', async () => {
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        create.disabled = true;
        try {
          const { list } = await listApi('/api/lists', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, share_with: [...chosen] })
          });
          creatingList = false;
          openListId = list.id;
          await refreshLists();
        } catch (err) {
          create.disabled = false;
          input.value = '';
          input.placeholder = err.message;
        }
      });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') create.click(); });

      actions.appendChild(cancel);
      actions.appendChild(create);
      wrap.appendChild(actions);

      setTimeout(() => input.focus(), 0);
      return wrap;
    }

    function renderDetail(list) {
      if (!list) { openListId = null; renderOverview(); return; }

      const head = el('div', 'list-head');
      const back = el('button', 'icon-btn');
      back.appendChild(icon(['m15 18-6-6 6-6']));
      back.addEventListener('click', () => {
        openListId = null; confirmingDelete = false; renamingList = false; renderLists();
      });
      head.appendChild(back);

      if (renamingList) {
        const input = el('input', 'list-title-input');
        input.value = list.name;
        const commit = async () => {
          const name = input.value.trim();
          renamingList = false;
          if (name && name !== list.name) {
            try { await listApi(`/api/lists/${list.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name })
            }); } catch {}
          }
          await refreshLists();
        };
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { renamingList = false; renderLists(); }
        });
        input.addEventListener('blur', commit);
        head.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        head.appendChild(el('div', 'list-title', list.name));
        if (list.is_owner) {
          const rename = el('button', 'icon-btn');
          rename.title = 'Rename list';
          rename.appendChild(icon(['M12 20h9', 'M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z']));
          rename.addEventListener('click', () => { renamingList = true; renderLists(); });
          head.appendChild(rename);

          const del = el('button', 'icon-btn danger');
          del.title = 'Delete list';
          del.appendChild(icon(['M3 6h18', 'M8 6V4h8v2', 'M19 6l-1 14H6L5 6']));
          del.addEventListener('click', () => { confirmingDelete = true; renderLists(); });
          head.appendChild(del);
        }
      }
      listsWrap.appendChild(head);

      const remaining = list.total - list.done;
      const ownerNote = list.is_owner ? '' : ` · shared by ${list.owner}`;
      listsWrap.appendChild(el('div', 'list-subtitle',
        `${remaining} of ${list.total} left${ownerNote}`));

      if (confirmingDelete) {
        const bar = el('div', 'confirm-bar');
        bar.appendChild(el('span', null, `Delete "${list.name}" and everything on it?`));
        const yes = el('button', 'yes', 'Delete');
        yes.addEventListener('click', async () => {
          confirmingDelete = false;
          try { await listApi(`/api/lists/${list.id}`, { method: 'DELETE' }); } catch {}
          openListId = null;
          await refreshLists();
        });
        const no = el('button', 'no', 'Cancel');
        no.addEventListener('click', () => { confirmingDelete = false; renderLists(); });
        bar.appendChild(yes); bar.appendChild(no);
        listsWrap.appendChild(bar);
      }

      // Only the owner decides the audience; everyone else just sees who has it.
      if (list.is_owner) {
        const row = el('div', 'share-row');
        row.appendChild(el('span', 'share-label', 'Shared with'));
        for (const person of familyPeople) {
          const on = list.shared_with.includes(person.name);
          const chip = el('button', on ? 'share-chip on' : 'share-chip', person.name);
          chip.addEventListener('click', async () => {
            const next = familyPeople
              .filter(p => (p.email === person.email ? !on : list.shared_with.includes(p.name)))
              .map(p => p.email);
            chip.disabled = true;
            try { await listApi(`/api/lists/${list.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ share_with: next })
            }); } catch {}
            await refreshLists();
          });
          row.appendChild(chip);
        }
        listsWrap.appendChild(row);
      } else if (list.shared_with.length) {
        const row = el('div', 'share-row');
        row.appendChild(el('span', 'share-label', 'Also shared with'));
        row.appendChild(el('span', 'chip', list.shared_with.join(', ')));
        listsWrap.appendChild(row);
      }

      const items = el('div', 'list-items');
      if (!list.items.length) {
        items.appendChild(el('div', 'list-empty', 'Nothing on this list yet'));
      }
      for (const item of list.items) {
        const row = el('div', item.done ? 'list-item done' : 'list-item');

        const box = el('button', 'box');
        box.appendChild(icon(['m4 12 5 5L20 6']));
        box.addEventListener('click', async () => {
          row.classList.toggle('done');           // optimistic — the refresh confirms it
          try { await listApi(`/api/lists/${list.id}/items/${item.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: !item.done })
          }); } catch {}
          await refreshLists();
        });
        row.appendChild(box);

        row.appendChild(el('div', 'text', item.text));
        if (item.added_by && item.added_by !== 'You') row.appendChild(el('span', 'who', item.added_by));

        const remove = el('button', 'remove');
        remove.title = 'Remove item';
        remove.appendChild(icon(['M18 6 6 18', 'm6 6 12 12']));
        remove.addEventListener('click', async () => {
          try { await listApi(`/api/lists/${list.id}/items/${item.id}`, { method: 'DELETE' }); } catch {}
          await refreshLists();
        });
        row.appendChild(remove);

        items.appendChild(row);
      }
      listsWrap.appendChild(items);

      const add = el('input', 'list-add-input');
      add.placeholder = 'Add an item…';
      add.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const text = add.value.trim();
        if (!text) return;
        add.value = '';
        try { await listApi(`/api/lists/${list.id}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        }); } catch {}
        await refreshLists();
        // Keep focus in the box so several items can be typed in a row.
        const next = listsWrap.querySelector('.list-add-input');
        if (next) next.focus();
      });
      listsWrap.appendChild(add);
    }

    // Keep the Lists tab live so an item another family member adds turns up on its own.
    setInterval(() => {
      const listsActive = document.getElementById('listsView').classList.contains('active');
      // Don't yank a half-typed list name or rename out from under the user.
      if (listsActive && !creatingList && !renamingList) fetchLists();
    }, 60000);

    setInterval(fetchMessages, 60000);

    (async function init() {
      try {
        const res = await fetch('/api/user');
        if (res.status === 401) { window.location.href = '/'; return; }
        fetchMessages();
      } catch {}
    })();
  </script>
</body>
</html>
